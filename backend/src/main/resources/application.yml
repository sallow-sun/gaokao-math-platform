server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 12h
      cookie:
        name: MATHSEA_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: mathsea-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mathsea}
    username: ${DB_USER:mathsea}
    password: ${DB_PASSWORD:mathsea_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  session:
    store-type: redis
    redis:
      namespace: mathsea:session
      flush-mode: on-save
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: cn.mathsea.backend.config.mybatis
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

mathsea:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    root: ${STORAGE_ROOT:./uploads}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
    login-window-seconds: ${LOGIN_WINDOW_SECONDS:600}
    register-max-attempts: ${REGISTER_MAX_ATTEMPTS:5}
    register-window-seconds: ${REGISTER_WINDOW_SECONDS:3600}
