<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>创建账号</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>
    <main class="page-container">
        <section class="login-card register-card">
            <h1 class="card-title">创建账号</h1>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="username">用户名</label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="2到20个字符"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">手机号码</label>

                    <input
                        id="phone"
                        name="phone"
                        type="tel"
                        placeholder="选填"
                        autocomplete="tel"
                    >
                </div>

                <div class="form-group">
                    <label for="email">电子邮箱</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="请输入电子邮箱"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">密码</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="密码"
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>

                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        placeholder="再次输入密码"
                        autocomplete="new-password"
                    >
                </div>

                <button
                    id="registerButton"
                    class="primary-button"
                    type="submit"
                >
                    创建账号
                </button>

                <p id="message" class="message"></p>
                
                <div class="agreement-row">
                    <label class="agreement-label">
                        <input
                            id="agreeTerms"
                            name="agreeTerms"
                            type="checkbox"
                        >
                        <span>
                            我已阅读并同意
                            <a href="/user-agreement" target="_blank">
                                《用户协议》
                            </a>
                        </span>
                    </label>
                </div>

            </form>
            <div class="divider"></div>

            <div class="single-link">
                <a href="{{ url_for('login_page') }}">
                    返回登录
                </a>
            </div>
        </section>
    </main>

    <script
        src="{{ url_for('static', filename='js/register.js') }}"
    ></script>
</body>
</html>
