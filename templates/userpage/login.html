<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>登录账号</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='userpage/css/style.css') }}"
    >
</head>

<body>
    <main class="page-container">
        <section class="login-card">

            <div class="brand">
                <div class="logo">&Sigma;</div>
                <span class="brand-name">
                    <span class="brand-cn">数海</span>
                    <span class="brand-en">MathSea</span>
                </span>
            </div>
            
            <h1 id="cardTitle" class="card-title">登录账号</h1>

            <div id="loginContent">
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="account">登录账号</label>

                        <input
                            id="account"
                            name="account"
                            type="text"
                            placeholder="用户名或UID"
                            autocomplete="username"
                        >
                    </div>

                    <div
                        id="passwordGroup"
                        class="form-group hidden"
                    >
                        <label for="password">登录密码</label>

                        <div class="password-wrapper">
                            <input
                                id="password"
                                name="password"
                                type="password"
                                placeholder="请输入登录密码"
                                autocomplete="current-password"
                            >

                            <button
                                id="togglePassword"
                                class="password-toggle"
                                type="button"
                            >
                                显示
                            </button>
                        </div>
                    </div>

                    <button
                        id="nextButton"
                        class="primary-button"
                        type="submit"
                    >
                        下一步
                    </button>

                    <p id="message" class="message"></p>
                </form>
                
                <div class="divider"></div>

                <div class="account-links">
                    <a href="{{ url_for('register_page') }}">
                        创建账号
                    </a>

                    <a href="{{ url_for('forgot_page') }}">
                        忘记密码？
                    </a>
                </div>
            </div>


            <div id="loginSuccess" class="login-success hidden">
                <div class="success-icon">✓</div>
                <p>登录成功</p>
            </div>
        </section>
    </main>

    <script
    src="{{ url_for('static', filename='userpage/js/login.js') }}"
></script>
</body>
</html>
