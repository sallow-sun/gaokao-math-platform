<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>重置密码</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>
    <main class="page-container">
        <section class="login-card register-card">
            <h1 class="card-title">重置密码</h1>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="account">账号</label>

                    <input
                        id="account"
                        name="account"
                        type="text"
                        placeholder="用户名、UID或手机号码"
                    >
                </div>

                <div class="form-group">
                    <label for="email">注册邮箱</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="请输入注册时使用的邮箱"
                    >
                </div>

                <div class="form-group">
                    <label for="newPassword">新密码</label>

                    <input
                        id="newPassword"
                        name="newPassword"
                        type="password"
                        placeholder="至少6位"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>

                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        placeholder="再次输入新密码"
                    >
                </div>

                <button
                    id="resetButton"
                    class="primary-button"
                    type="submit"
                >
                    修改密码
                </button>

                <p id="message" class="message"></p>
            </form>

            <div class="divider"></div>

            <div class="single-link">
                <a href="{{ url_for('login_page') }}">
                    返回登录
                </a>
            </div>
        </section>
    </main>

    <script
        src="{{ url_for('static', filename='js/forgot.js') }}"
    ></script>
</body>
</html>
