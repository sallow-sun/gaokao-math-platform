<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/header-panel.css">
  <link rel="stylesheet" href="css/content.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/responsive.css">
  <title>题目详情 - P10001</title><!--题目详情-题号-->
</head>

<!--所有class名均为小写-->

<body>
  <header>
    <a id="header-return" href="index.html">← 返回</a><!--返回按钮-->
    <span id="header-location">题库/P10001</span><!--目前所在的位置-->
    <a id="header-user" href=""><img id="header-userimg" src="./img/background.jpg" alt=""></a><!--用户头像-->
  </header>
  <!--最上方功能栏，显示返回按钮，位置，用户头像-->

  <main class="page-container">
    <article>
    <!--题目页面-->

      <section class="header-panel">
        <div class="header-panel-title">
            <span class="header-panel-title-id">P10001</span>
            <span><span>2025年新高考Ⅰ卷</span><span>T1</span></span><span>单选</span>
        </div>
        <div class="header-panel-stats">
          <div class="header-panel-stats-item">
              <span>浏览</span>
              <span>1.3M</span>
          </div>
          <div class="header-panel-stats-item">
              <span>通过</span>
              <span>73.7k</span>
          </div>
          <div class="header-panel-stats-item">
              <span>下载</span>
              <span>20.0k</span>
          </div>
          <div class="header-panel-stats-item">
              <span>收藏</span>
              <span>10.0k</span>
          </div>
        </div>
        <div class="header-panel-button">
            <button>加入题单</button>
            <!--点击后弹窗，选择要加入的题单-->
            <button>下载题目</button>
            <!--点击后弹窗，选择下载为latex/以图片保存/以PPT保存-->
        </div>
      </section>
      <!--正上方，题目名称栏header-->
      <!--题目栏颜色与题型保持一致。单选：红；多选：黄；填空：蓝；解答：绿；其他：白-->

      <div class="page-layout">
        <section class="content-panel">
          <p>1.(1+5i)i 的虚部为()</p>
          <span>A.-1</span>
          <span>B. 0</span>
          <span>C. 1</span>
          <span>D. 6</span>
        </section>
        <!--正左，题面栏content-->
        <!--此处的题目应该是直接从后台调出来，目前仅作展示-->

        <aside class="sidebar">
          <section class="information-panel">
            <p><span class="information-panel-title">题目编号</span>    <span>P10001</span></p>
            <p><span class="information-panel-title">来源</span>    <span>2025新高考Ⅰ卷</span></p>
            <p><span class="information-panel-title">上传者</span>  <span>user001</span></p>
            <p><span class="information-panel-title">训练价值</span>    <span>RED</span></p>
            <p><button>点击打卡</button></p>
            <p><button>练习记录</button></p>
            <p><button>收藏题目</button></p>
            <p><button>题目反馈</button></p>
          </section>
          <!--正右从上往下第一个，题目信息栏information-->

          <section class="answer-panel">
            <h2>答案解析</h2>
            <a href="">进入题解区</a>
            <button>显示答案</button>
          </section>
          <!--正右从上往下第二个，题目解析栏answer-->

          <section class="tag-panel">
            <h2>标签</h2>
            <span>高考真题</span>
            <button>显示题目标签</button>
          </section>
          <!--正右从上往下第三个，题目Tag栏tag-->

          <section class="discussion-panel">
            <h2>题目讨论</h2>
            <span>进入讨论版</span>
            <button>查看讨论</button>
          </section>
          <!--正右从上往下第四个，题目讨论栏discussion-->

          <section class="collection-panel">
            <h2>本题收录于</h2>
            <span>官方题单-集合</span>
            <button>查看收录情况</button>
          </section>
          <!--正右从上往下第五个，题目收录栏collection-->
          
          <section class="recommendation-panel">
          <h2>推荐题目</h2>
          <span>P10002 2024年新高考Ⅰ卷T1</span>
          <button>查看推荐</button>
          </section>
          <!--正右从上往下第六个，题目推荐栏recommendation-->
        </aside>
      </div>
    </article>
  </main>
</body>
</html>
