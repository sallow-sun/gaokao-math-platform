name: Document workbench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  independent-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: document-worker/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-math fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
        working-directory: document-worker
      - run: python -m unittest -v test_worker test_real_word
        working-directory: document-worker
        env:
          LIBREOFFICE_BIN: /usr/bin/soffice
      - run: bash -n deploy/install-document-worker.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node tests/document-import.browser.test.cjs
        working-directory: frontend
